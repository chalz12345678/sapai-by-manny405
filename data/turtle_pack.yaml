# Super Auto Pets - Turtle Pack: the single source of truth for game data.
#
# After editing, rebuild and test (see docs/PATCHING.md):
#     python -m sapai.build_data
#     python -m pytest      (or: python -m unittest discover -s tests)
#
# Pets: tier, base attack/health, trigger, and for each level the ability
#   text shown to players plus the effect the engine runs. Keep text and
#   effect in step: the build warns when a number in the text is not in the
#   effect. Effect kinds, targets and triggers are listed in docs/PATCHING.md.
# summoned_pets: never stocked; "?" stats are set by whatever summons them.
# foods / pet_created_foods: cost, text and effect (all trigger on buy).
# statuses: perks that foods and abilities give pets.
#
# Shop odds are built from the tiers: each shop slot is drawn uniformly from
# every pet (or food) of the tiers available that turn.

pack:
  name: Turtle
  internal_id: StandardPack
  game_version: unknown - data checked against the game on 2026-11-11
  sources:
  - Super Auto Pets Wiki (superautopets.wiki.gg)
  - the game app
rules:
  # General rules. Per-turn rules are in turns below; turn 11 covers every
  # later turn too.
  starting_gold: 10        # gold at the start of every turn
  roll_cost: 1
  pet_cost: 3
  max_team_size: 5
  max_shop_slots: 7        # shop slots including food
  max_stat: 50             # attack and health cap
  starting_lives: 10       # arena; see docs/RULES.md for open questions
  wins_to_win: 10
  # Sell value is the pet's level (plus any Cake bonus).
  turns:
  - {index: 1, foodShopSlots: 1, animalShopSlots: 3, livesLost: 1, tiersAvailable: 1, levelUpTier: 2}
  - {index: 2, foodShopSlots: 1, animalShopSlots: 3, livesLost: 1, tiersAvailable: 1, levelUpTier: 2}
  - {index: 3, foodShopSlots: 2, animalShopSlots: 3, livesLost: 2, tiersAvailable: 2, levelUpTier: 3}
  - {index: 4, foodShopSlots: 2, animalShopSlots: 3, livesLost: 2, tiersAvailable: 2, levelUpTier: 3}
  - {index: 5, foodShopSlots: 2, animalShopSlots: 4, livesLost: 3, tiersAvailable: 3, levelUpTier: 4}
  - {index: 6, foodShopSlots: 2, animalShopSlots: 4, livesLost: 3, tiersAvailable: 3, levelUpTier: 4}
  - {index: 7, foodShopSlots: 2, animalShopSlots: 4, livesLost: 3, tiersAvailable: 4, levelUpTier: 5}
  - {index: 8, foodShopSlots: 2, animalShopSlots: 4, livesLost: 3, tiersAvailable: 4, levelUpTier: 5}
  - {index: 9, foodShopSlots: 2, animalShopSlots: 5, livesLost: 4, tiersAvailable: 5, levelUpTier: 6}
  - {index: 10, foodShopSlots: 2, animalShopSlots: 5, livesLost: 4, tiersAvailable: 5, levelUpTier: 6}
  - name: Turn 11+
    index: 11
    foodShopSlots: 2
    animalShopSlots: 5
    livesLost: 5
    tiersAvailable: 6
    levelUpTier: 6
