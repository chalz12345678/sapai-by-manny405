################################################################################
# Crab: "Start of battle: Copy 25%/50%/75% of health from the most healthy
# friend". "Copy" is read as: the Crab's health becomes that amount.
################################################################################

- name: Crab L1 copies 25% of the healthiest friend's health
  source: 'Crab text "Start of battle: Copy 25% of health from the most healthy friend"'
  verified: false
  team: [Crab 3/1, Fish 1/8]
  enemy: [Pig 1/2]
  # Start: Crab health = 25% of 8 = 2. R1: Crab 3/1, Pig faints.
  result: win
  survivors: {team: [Crab 3/1, Fish 1/8], enemy: []}

- name: Crab L2 copies 50% of the healthiest friend's health
  source: 'Crab text "Start of battle: Copy 50% of health from the most healthy friend"'
  verified: false
  team: [Crab 3/1 L2, Fish 1/8, Fish 1/4]
  enemy: [Pig 1/2]
  # Start: Crab health = 50% of 8 = 4. R1: Crab 3/3, Pig faints.
  result: win
  survivors: {team: [Crab 3/3 L2, Fish 1/8, Fish 1/4], enemy: []}

- name: Crab L3 copies 75% of the healthiest friend's health
  source: 'Crab text "Start of battle: Copy 75% of health from the most healthy friend"'
  verified: false
  team: [Crab 3/1 L3, Fish 1/8]
  enemy: [Pig 1/2]
  # Start: Crab health = 75% of 8 = 6. R1: Crab 3/5, Pig faints.
  result: win
  survivors: {team: [Crab 3/5 L3, Fish 1/8], enemy: []}

# FIXED (was an engine mismatch): the engine counts the Crab itself as its "most healthy
# friend" (HighestHealthFriend in sapai/effects.py get_target does not leave
# out the activating pet), so it copies 25% of its own 12 health (3/3, then
# 3/2 after round 1).
- name: Crab copies a friend, not itself, even when it is the healthiest
  source: 'Crab text "Copy 25% of health from the most healthy friend"'
  verified: false
  team: [Crab 3/12, Fish 1/8]
  enemy: [Pig 1/2]
  # Start: Crab health = 25% of 8 = 2. R1: Crab 3/1, Pig faints.
  result: win
  survivors: {team: [Crab 3/1, Fish 1/8], enemy: []}

# FIXED (was an engine mismatch): same cause as above. With no friend the engine copies 25%
# of the Crab's own health (12 -> 3).
- name: Crab with no friends keeps its health
  source: 'Crab text "Copy 25% of health from the most healthy friend"'
  verified: false
  team: [Crab 3/12]
  enemy: [Pig 1/2]
  # Start: nothing to copy. R1: Crab 3/11, Pig faints.
  result: win
  survivors: {team: [Crab 3/11], enemy: []}

