# FIXED (was an engine mismatch): the engine never runs friend-summoned abilities of the team
# a pet is summoned onto when the summoner is on the other team
# (sapai/battle.py check_summon_triggers returns early for team "Enemy"), so
# the enemy Horse does not buff the Dirty Rat. In the engine Fish trades with
# the Pig and only the Horse survives.
- name: Horse buffs a Dirty Rat that the opponent's Rat summons onto its team
  source: 'Horse text "Friend summoned: Give it +1 attack"; Rat text "Summon ... at the front of the opponent''s team"'
  verified: false
  team: [Rat 1/1, Fish 2/3]
  enemy: [Pig 1/5, Horse 1/1]
  # R1: Rat faints, Pig 1/4; Dirty Rat 1/1 joins the enemy front and their
  # Horse makes it 2/1. R2: Fish 2/1, Dirty Rat faints.
  # R3: Fish faints, Pig 1/2.
  result: loss
  survivors: {team: [], enemy: [Pig 1/2, Horse 1/1]}

