# Tier 1 and tier 2 pet abilities, worked out by hand from the ability text
# in data/turtle_pack.yaml. Front of the team first; stats as the game shows
# them at the start of the battle. Pig and Fish have no battle ability, so
# they are used as plain stat sticks.

################################################################################
# Ant: "Faint: Give one random friend +1/+2/+3 attack and health"
################################################################################

- name: Ant L1 gives its only friend +1/+1
  source: 'Ant text "Faint: Give one random friend +1 attack and +1 health"'
  verified: false
  team: [Ant 2/1, Fish 2/4]
  enemy: [Pig 2/6]
  # R1: Ant faints, Pig 2/4; Fish 3/5. R2: Fish 3/3, Pig 2/1.
  # R3: Fish 3/1, Pig faints.
  result: win
  survivors: {team: [Fish 3/1], enemy: []}

- name: Ant L2 gives its only friend +2/+2
  source: 'Ant text "Faint: Give one random friend +2 attack and +2 health"'
  verified: false
  team: [Ant 1/1 L2, Fish 2/2]
  enemy: [Pig 1/1, Pig 3/3]
  # R1: Ant and Pig faint; Fish 4/4. R2: Fish 4/1, Pig faints.
  result: win
  survivors: {team: [Fish 4/1], enemy: []}

- name: Ant L3 gives +3/+3 but stats stop at 50
  source: 'Ant text "Faint: Give one random friend +3 attack and +3 health"; max stat 50'
  verified: false
  team: [Ant 1/1 L3, Fish 49/49]
  enemy: [Pig 1/1]
  # R1: Ant and Pig faint; Fish 52/52 capped to 50/50.
  result: win
  survivors: {team: [Fish 50/50], enemy: []}

- name: Ant does not buff enemies
  source: 'Ant text "Give one random friend"'
  verified: false
  team: [Ant 2/1]
  enemy: [Pig 2/3]
  # R1: Ant faints with no friend to buff; Pig 2/1.
  result: loss
  survivors: {team: [], enemy: [Pig 2/1]}

