# Perks (food effects held by a pet). Front first; stats as the game shows.

- name: Garlic takes 2 less damage but never less than 1
  source: Garlic text "Take 2 less damage (minimum 1)"
  verified: false
  team: [Fish 2/3 Garlic]
  enemy: [Mosquito 2/2]
  # Mosquito's 1 damage at start of battle becomes 1 (minimum), Fish 2/2.
