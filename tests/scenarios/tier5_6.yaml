# Tier 5 and tier 6 battle abilities, worked out by hand from the ability
# text and the standard rules. Front first. Filler pets with no battle
# ability: Fish, Pig, Duck, Beaver (tier 1), Squirrel, Bison (tier 4).

################################################################################
#### Scorpion
################################################################################

- name: Scorpion's Peanut knocks out a big pet
  source: 'Scorpion text "Summoned: Gain the Peanut perk (knocks out any pet it damages)"'
  verified: false
  team: [Scorpion 1/3 Peanut]
  enemy: [Bison 40/40]
  # Round 1: both take damage; Peanut knocks out the Bison.
  result: draw
  survivors: {team: [], enemy: []}

# FIXED (was an engine mismatch): the Scorpion's "Summoned" ability fires when a FRIEND is
# summoned (friend_summoned_trigger in sapai/pets.py never checks
# triggeredBy Self), so the Zombie Cricket's summon gives the Scorpion Peanut
# in place of its Garlic and the battle ends in a draw.
- name: Scorpion does not gain Peanut when a friend is summoned
  source: 'Scorpion text "Summoned: Gain the Peanut perk" (only when it is summoned itself)'
  verified: false
  team: [Cricket 1/1, Scorpion 1/3 L2 Garlic]
  enemy: [Bison 5/50]
  # Round 1: Cricket faints (Bison 5/49), Zombie Cricket 1/1 is summoned.
  # Round 2: Zombie Cricket faints (Bison 5/48).
  # Round 3: Scorpion keeps Garlic and takes 5-2 = 3: faints. Bison 5/47.
  result: loss
  survivors: {team: [], enemy: [Bison 5/47]}

- name: Scorpion released by a Whale is summoned with Peanut
  source: 'Scorpion text "Summoned: Gain the Peanut perk"; Whale text'
  verified: false
  team: [Scorpion 1/3 Garlic, Whale 3/7]
  enemy: [Bison 5/50]
  # Start: Whale swallows the Scorpion.
  # Round 1: Whale 3/2, Bison 5/47. Round 2: Whale faints, Bison 5/44, and
  # releases a level 1 Scorpion (1/3), which is summoned and gains Peanut.
  # Round 3: Scorpion and Bison both faint.
  result: draw
  survivors: {team: [], enemy: []}

