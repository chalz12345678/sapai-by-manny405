# FIXED (was an engine mismatch): battle_phase_knockout (sapai/battle.py) re-runs Rhino's
# ability whenever phase_hurt_and_faint_k grew, and a Hurt ability (Gorilla
# gaining Coconut) grows it too. Rhino then fires a second time without a
# knock-out and strips the Gorilla's new Coconut, so the engine gives a draw.
