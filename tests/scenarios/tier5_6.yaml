  source: 'Rhino text "Knock out: ..."; Gorilla text "Hurt: Gain Coconut"'
  verified: false
  team: [Rhino 6/10]
  enemy: [Pig 4/1, Gorilla 7/10]
  # Round 1: Rhino knocks out Pig, Rhino 6/6. Knock out: 4 to Gorilla (7/6),
  # which gains Coconut. No knock-out, so Rhino stops.
  # Round 2: Coconut blocks Rhino's hit; Rhino takes 7 and faints.
  result: loss
  survivors: {team: [], enemy: [Gorilla 7/6]}

- name: Tiger behind Rhino repeats the knock-out damage
  source: 'Tiger text "repeats its ability in battle as if it were level 1"'
  verified: false
  team: [Rhino 6/10, Tiger 6/4]
  enemy: [Pig 4/1, Squirrel 3/10, Bison 4/10]
  # Round 1: Pig out, Rhino 6/6. 4 + 4 (Tiger) to Squirrel: 3/2.
  # Round 2: Squirrel out, Rhino 6/3. 4 + 4 to Bison: 4/2.
  # Round 3: Bison and Rhino both faint.
  result: win
  survivors: {team: [Tiger 6/4], enemy: []}

