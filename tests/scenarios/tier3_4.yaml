- name: Badger in the middle hits the friends on both sides
  source: 'Badger text "adjacent pets"; Dolphin text'
  verified: false
  team: [Fish 2/20, Badger 6/3, Pig 2/20]
  enemy: [Dolphin 1/50]
  # Start: Dolphin deals 4 to the lowest health enemy, Badger, which faints
  # and deals 3 to Fish (2/17) and Pig (2/17).
  # Fish deals 2 a round and takes 1: it faints in R17, Dolphin at 16.
  # Pig then needs 8 rounds: Dolphin faints in R25, Pig 2/9.
  result: win
  survivors: {team: [Pig 2/9], enemy: []}

