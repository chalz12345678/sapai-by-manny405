# Tier 3 and tier 4 pet abilities, from their text. Front first; stats as
# the game shows them. Expected results are worked out by hand from the
# ability text (front pets hit each other at the same time; abilities in a
# phase go highest attack first). Pig, Fish, Beaver and Duck have no battle
# abilities, so they are used as plain pets.

################################################################################
# Dodo: "Start of battle: Give 50/100/150% of this pet's attack to the nearest
# friend ahead."
################################################################################

- name: Dodo L1 gives half its attack to the friend ahead
  source: 'Dodo text "Give 50% of this pet''s attack to the nearest friend ahead"'
  verified: false
  team: [Fish 2/3, Dodo 4/2]
  enemy: [Pig 1/10]
  # Fish 4/3. R1 Pig 6, R2 Pig 2, R3 Fish faints and Pig faints (-2).
  result: win
  survivors: {team: [Dodo 4/2], enemy: []}

- name: Dodo L2 gives all its attack to the friend ahead
  source: 'Dodo text "Give 100% of this pet''s attack to the nearest friend ahead"'
  verified: false
  team: [Fish 2/3, Dodo 4/2 L2]
  enemy: [Pig 1/13]
  # Fish 6/3. R1 Pig 7, R2 Pig 1, R3 both faint.
  result: win
  survivors: {team: [Dodo 4/2 L2], enemy: []}

- name: Dodo L3 gives 150% of its attack to the friend ahead
  source: 'Dodo text "Give 150% of this pet''s attack to the nearest friend ahead"'
  verified: false
  team: [Fish 2/3, Dodo 4/2 L3]
  enemy: [Pig 1/17]
  # Fish 8/3. R1 Pig 9, R2 Pig 1, R3 both faint.
  result: win
  survivors: {team: [Dodo 4/2 L3], enemy: []}

- name: Dodo cannot push the friend ahead above 50 attack
  source: Dodo text and the 50 stat cap
  verified: false
  team: [Fish 48/3, Dodo 4/2]
  enemy: [Pig 1/50]
  # Fish 50/3 (not 50+). R1 Pig takes 50 and faints.
  result: win
  survivors: {team: [Fish 50/2, Dodo 4/2], enemy: []}

# FIXED (was an engine mismatch): Pet.attack (sapai/pets.py) adds the perk's damage bonus
# (Meat Bone +3, Steak +20, Peanut 1000), and TransferStats uses it, so Dodo
# gives 50% of 7 = 3 and Fish faints one round earlier.
- name: Dodo gives half of its attack stat, not of its Meat Bone damage
  source: 'Dodo text "50% of this pet''s attack"; Meat Bone "Attacks deal +3 damage"'
  verified: false
  team: [Fish 2/3, Dodo 4/2 Meat Bone]
  enemy: [Pig 1/13]
  # Dodo's attack is 4 (Meat Bone only adds damage to its attacks), so Fish
  # gets +2: 4/3. R1 Pig 9, R2 Pig 5, R3 Fish faints, Pig 1.
  # R4 Dodo hits for 4+3: Pig faints, Dodo 4/1.
  result: win
  survivors: {team: [Dodo 4/1 Meat Bone], enemy: []}

