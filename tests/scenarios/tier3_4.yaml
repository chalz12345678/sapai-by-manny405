################################################################################
# Ox: "Friend ahead faints: Gain Melon and +1 attack. Works 1/2/3 times per
# turn."
################################################################################

- name: Ox gains Melon and +1 attack when the friend ahead faints
  source: 'Ox text "Friend ahead faints: Gain Melon and +1 attack"'
  verified: false
  team: [Fish 1/1, Ox 1/3]
  enemy: [Pig 1/10]
  # R1 Fish faints, Pig 9; Ox 2/3 Melon. R2 Melon blocks, Pig 7.
  # R3 Ox 2/2, Pig 5. R4 Ox 2/1, Pig 3. R5 Ox faints, Pig 1.
  result: loss
  survivors: {team: [], enemy: [Pig 1/1]}

# FIXED (was an engine mismatch): Ant (higher attack) runs its faint ability first, and
# tiger_func (sapai/pets.py) removes the fainted Ant from the team. Ox then
# looks for its friend ahead with team.get_ahead, finds nobody, and does not
# trigger (Pet.faint_trigger, FriendAhead branch).
- name: Ox triggers when the friend ahead has a faint ability of its own
  source: Ox and Ant text
  verified: false
  team: [Ant 2/1, Ox 1/3]
  enemy: [Pig 1/10]
  # R1 Ant faints, Pig 8. Ant gives its only friend, Ox, +1/+1 (2/4) and Ox
  # gains Melon and +1 attack (3/4 Melon), in either order.
  # R2 Melon blocks, Pig 5. R3 Ox 3/3, Pig 2. R4 Pig faints, Ox 3/2.
  result: win
  survivors: {team: [Ox 3/2], enemy: []}

# Passes, but for the wrong reason: the engine misses the Sheep faint (same
# bug as the Ant scenario above) and triggers on the second Ram instead.
- name: Ox L1 works only once per turn
  source: 'Ox text "Works 1 time per turn"; Sheep text'
  verified: false
  team: [Sheep 2/1, Ox 1/3]
  enemy: [Pig 2/30]
  # R1 Sheep faints (Pig 28): two 2/2 Rams in front, Ox 2/3 Melon.
  # R2 Ram faints (Pig 26); it was not directly ahead of Ox.
  # R3 Ram faints (Pig 24): Ox already used its one trigger.
  # R4 Melon blocks (Pig 22). R5 Ox 2/1 (Pig 20). R6 Ox faints (Pig 18).
  result: loss
  survivors: {team: [], enemy: [Pig 2/18]}

# FIXED (was an engine mismatch): Ox misses the Sheep fainting (Sheep's own faint ability
# runs first and removes it from the team), so it only triggers once, on the
# second Ram.
- name: Ox L2 works twice per turn
  source: 'Ox text "Works 2 times per turn"; Sheep text'
  verified: false
  team: [Sheep 2/1, Ox 1/3 L2]
  enemy: [Pig 2/30]
  # As above, but in R3 Ox triggers again: 3/3 Melon.
  # R4 Melon blocks (Pig 21). R5 Ox 3/1 (Pig 18). R6 Ox faints (Pig 15).
  result: loss
  survivors: {team: [], enemy: [Pig 2/15]}

