# Battles captured from the real game with the Battle Lab and checked by hand.
# (The lab itself saves to from_game.yaml and game_discrepancies.yaml, which
# stay on your computer; battles worth keeping for everyone go here.)

- name: Skunk L2 rounds up (31 removed from 46 health)
  source: real game, 2026-11-15, Battle Lab capture
  verified: true
  seen: true
  team: ["Turtle 11/14 L2", "Peacock 37/45 L2", "Leopard 49/46", "Worm 16/21 L3", "Cat 9/10 L2"]
  enemy: ["Skunk 8/10 L2 Melon", "Parrot 5/3", "Cricket 20/21 L2 Melon", "Leopard 20/14 L2 Melon", "Tiger 6/4 Garlic"]
  # Skunk removes 66% of the Leopard's 46 health: 30.36, rounded up to 31,
  # leaving 15 (rounding to nearest left 16, which the game never shows).
  result: win
  survivors: {team: ["Leopard 49/15", "Worm 16/11 L3"], enemy: []}

- name: Skunk L1 rounds up again (3 removed from 7 health); Cake does nothing in battle
  source: real game, 2026-11-15, Battle Lab capture
  verified: true
  seen: true
  team: ["Peacock 10/15 L2", "Worm 5/10 L2", "Skunk 3/5", "Whale 3/7 Cake", "Mosquito 3/5"]
  enemy: ["Cricket 3/5 L2", "Sheep 2/2", "Dog 6/2", "Dog 6/4", "Horse 7/7 L3 Cake"]
  # Skunk removes 33% of the Horse's 7 health: 2.31, rounded up to 3, leaving
  # 4 (rounding to nearest would leave 5). The Whale swallows the Skunk, whose
  # ability still fires, and releases it when the Whale faints. The Horse is
  # never hit again when the Mosquito's start-of-battle shot goes elsewhere.
  result: loss
  survivors: {team: [], enemy: ["Horse 7/4 L3 Cake"]}

- name: Skunk L2 takes two thirds (34 from 50); a Parrot uses the Skunk ability it copied
  source: real game, 2026-11-15, Battle Lab capture and replay
  verified: true
  seen: true
  team: ["Turtle 11/14 L2", "Peacock 46/50 L2", "Leopard 50/50 L2", "Tiger 9/7", "Worm 16/21 L3"]
  enemy: ["Skunk 9/11 L2 Melon", "Parrot 5/3", "Cricket 20/21 L2 Melon", "Leopard 20/14 L2 Melon", "Tiger 8/6 L2"]
  # As seen in the replay: our Leopard hits their Cricket and Leopard, our
  # Tiger repeats it and knocks out their Leopard, which still hits our Worm
  # and Turtle; their Tiger repeats it on our Tiger and Leopard (50 -> 40).
  # Their Skunk takes 34 of our Peacock's 50 (two thirds, rounded up), then
  # their Parrot, with the Skunk ability copied at end of turn, takes 14 of
  # our Leopard's 40 (a third, rounded up), leaving 26.
  result: win
  survivors: {team: ["Leopard 50/16 L2", "Worm 16/11 L3"], enemy: []}
